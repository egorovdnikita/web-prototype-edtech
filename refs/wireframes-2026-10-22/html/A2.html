<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;background:#f5f5f5">
  <div class="card" style="margin:0">
    <p class="small muted">Состояние 1 · Забыли пароль</p>
    <h3>Восстановление пароля</h3>
    <label class="f">Почта</label>
    <input type="email" placeholder="you@example.com" style="width:100%">
    <button class="pri" style="margin-top:10px">Прислать ссылку</button> {01.05}
  </div>
  <div class="card" style="margin:0">
    <p class="small muted">Состояние 2 · Переход по ссылке из письма</p>
    <h3>Новый пароль</h3>
    <label class="f">Пароль</label><input type="password" style="width:100%">
    <label class="f">Повторите пароль</label><input type="password" style="width:100%">
    <button class="pri" style="margin-top:10px">Сохранить</button>
  </div>
  <div class="card" style="margin:0">
    <p class="small muted">Состояние 3 · Письмо после регистрации</p>
    <h3>Подтвердите почту {01.06}</h3>
    <p class="small">Нажмите кнопку, чтобы закрепить почту you@example.com за вашим аккаунтом.</p>
    <button class="pri">Подтвердить почту</button>
    <p class="small st ok" style="margin-top:10px">✓ Почта подтверждена</p>
  </div>
</div>
