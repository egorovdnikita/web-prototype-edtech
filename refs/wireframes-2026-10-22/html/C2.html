<h1>Оформление заказа</h1>
<div class="cols">
  <div class="card">
    <p><b>Обществознание · тариф «С наставником»</b><br><span class="small muted">Октябрь: оставшиеся недели 3–4 {13.06}</span></p>
    <label class="f">Период {14.14} {14.23}</label>
    <label><input type="radio" name="p" checked> 1 месяц</label> <label><input type="radio" name="p"> 3 месяца</label> <label><input type="radio" name="p"> Весь год по фиксированной цене</label>
    <label class="f">Способ {14.20}</label>
    <label><input type="radio" name="b" checked> Оплатить полностью</label> <label><input type="radio" name="b"> Забронировать место</label>
    <label class="f">Ученик {14.15}</label>
    <label class="small"><input type="checkbox" checked> Покупаю для ребёнка</label>
    <div class="row"><input type="text" placeholder="Имя ученика"><input type="email" placeholder="Почта ученика"></div>
    <label class="f">Какой наставник подходит {13.02}</label>
    <div class="row small"><label><input type="checkbox"> спокойный</label><label><input type="checkbox" checked> строгий</label><label><input type="checkbox"> с юмором</label><label><input type="checkbox"> структурный</label></div>
  </div>
  <div class="card">
    <h3>Итого</h3>
    <div class="row small"><span class="grow">Тариф</span><span>4 900 ₽</span></div>
    <div class="row" style="margin:8px 0"><input type="text" placeholder="Промокод" class="grow"><button class="sm">Применить</button> {14.03}</div>
    <label class="small"><input type="checkbox"> Списать бонусы: 300 ₽</label> {15.06}
    <div class="row" style="margin-top:8px"><b class="grow">К оплате</b><b>4 600 ₽</b></div>
    <button class="pri" style="width:100%;margin-top:10px">Оформить и оплатить</button> {14.01}
  </div>
</div>
